<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Bridge</title>
<style>
:root{
  --bg:#eef0f4; --card:#ffffff; --ink:#1c2233; --line:#e3e6ec; --call:#3fae7a;
  --font:-apple-system,"Segoe UI",system-ui,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#14161c;--card:#1d2029;--ink:#eef0f6;--line:#2e323e;--call:#4cc18b;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);
  display:flex;align-items:center;justify-content:center;padding:12px}
.card{width:100%;max-width:300px;background:var(--card);border-radius:16px;overflow:hidden;
  border:1px solid var(--line);box-shadow:0 10px 30px -12px rgba(0,0,0,.25)}

.band{position:relative;height:104px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.orb{position:absolute;width:22px;height:22px;transform:translate(-50%,-50%);transition:opacity .3s}
.sun{border-radius:50%;background:radial-gradient(circle,#fff4cf 0 30%,#ffd56a 65%,#ffbf4d);box-shadow:0 0 20px 7px rgba(255,205,100,.45)}
.moon{overflow:visible;filter:drop-shadow(0 0 6px rgba(220,225,255,.45))}
.moon .dark-disc{fill:rgba(255,255,255,.10)}
.moon .lit{fill:#f1f2fa}
.scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}

.tabs{position:absolute;top:8px;left:10px;z-index:3;display:flex;gap:2px}
.tabs button{font:inherit;font-size:10.5px;border:0;background:transparent;color:inherit;opacity:.6;
  padding:3px 7px;border-radius:999px;cursor:pointer}
.tabs button:hover{opacity:.9}
.tabs button[aria-pressed=true]{opacity:1;background:rgba(255,255,255,.28);font-weight:600}
.band.dark .tabs button[aria-pressed=true]{background:rgba(255,255,255,.16)}
.tabs button:focus-visible{outline:1.5px solid currentColor;outline-offset:1px}

.info{position:relative;z-index:2;height:100%;display:flex;justify-content:space-between;align-items:flex-end;padding:10px 14px;pointer-events:none}
.label{font-size:12px;font-weight:600;line-height:1.3}
.label small{display:block;font-weight:400;opacity:.75;font-size:10.5px}
.time{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;text-align:right}
.time small{display:block;font-size:10.5px;font-weight:400;opacity:.8;margin-top:3px;letter-spacing:0}
.band.light{color:#1b2440}
.band.dark{color:#f4f4fb}
.band.dark .info{text-shadow:0 1px 3px rgba(0,0,0,.35)}
.band.light .info{text-shadow:0 0 6px rgba(255,255,255,.35)}

/* Smooth custom slider */
.controls{display:flex;align-items:center;gap:10px;padding:8px 14px}
.slider{position:relative;flex:1;height:22px;cursor:pointer;touch-action:none;outline:none;--thumb:var(--ink)}
.slider .track{position:absolute;left:0;right:0;top:8px;height:6px;border-radius:6px;background:var(--track,var(--line))}
.slider .rail{position:absolute;left:8px;right:8px;top:0;bottom:0}
.slider .thumb{position:absolute;top:3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;
  background:var(--thumb);border:2px solid var(--card);box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(0,0,0,.25);
  transition:background-color .25s}
.slider:focus-visible .thumb{box-shadow:0 0 0 3px var(--line),0 1px 3px rgba(0,0,0,.25)}
.slider.dragging{cursor:grabbing}
.now{font:inherit;font-size:11px;border:1px solid var(--line);background:transparent;color:var(--ink);
  padding:4px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.now:hover{background:var(--line)}
.now:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.band,.orb{transition:none}}

/* Menu bar app: the window is exactly the card, corners stay transparent */
html,body{background:transparent!important;height:auto;overflow:hidden}
body{display:block;padding:0}
.card{max-width:none;width:100%;box-shadow:none;border-color:rgba(127,127,127,.25)}
html,body,.card{-webkit-user-select:none;user-select:none;cursor:default}
</style>
</head>
<body>
<main class="card">
  <section class="band" id="top">
    <div class="orb sun"></div>
    <svg class="orb moon" viewBox="0 0 22 22" aria-hidden="true"><circle class="dark-disc" cx="11" cy="11" r="10"/><path class="lit"/></svg>
    <svg class="scene" viewBox="0 0 300 104" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
    <div class="tabs" role="group" aria-label="Top city">
      <button type="button" data-tz="Europe/Budapest" data-city="Budapest" data-country="Hungary" data-lat="47.50" data-lon="19.04" data-scene="budapest" aria-pressed="true">Budapest</button>
      <button type="button" data-tz="Europe/Helsinki" data-city="Helsinki" data-country="Finland" data-lat="60.17" data-lon="24.94" data-scene="helsinki" aria-pressed="false">Helsinki</button>
    </div>
    <div class="info">
      <div class="label"><span class="c"></span><small class="z"></small></div>
      <div class="time"><span class="t">--:--</span><small class="d"></small></div>
    </div>
  </section>

  <div class="controls">
    <div class="slider" id="slider" role="slider" tabindex="0" aria-label="Time in the top city"
      aria-valuemin="0" aria-valuemax="1439" aria-valuenow="0" title="Green = both between 08:00 and 20:00">
      <div class="track"></div>
      <div class="rail"><div class="thumb"></div></div>
    </div>
    <button type="button" class="now" id="now">Now</button>
  </div>

  <section class="band" id="bottom">
    <div class="orb sun"></div>
    <svg class="orb moon" viewBox="0 0 22 22" aria-hidden="true"><circle class="dark-disc" cx="11" cy="11" r="10"/><path class="lit"/></svg>
    <svg class="scene" viewBox="0 0 300 104" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
    <div class="tabs" role="group" aria-label="Bottom place">
      <button type="button" data-tz="Asia/Bangkok" data-city="Thailand" data-country="Bangkok" data-lat="13.75" data-lon="100.50" data-scene="thai" aria-pressed="false">Thailand</button>
      <button type="button" data-tz="Asia/Makassar" data-city="Bali" data-country="Indonesia" data-lat="-8.65" data-lon="115.22" data-scene="bali" aria-pressed="true">Bali</button>
      <button type="button" data-tz="Asia/Tokyo" data-city="Japan" data-country="Tokyo" data-lat="35.68" data-lon="139.69" data-scene="japan" aria-pressed="false">Japan</button>
    </div>
    <div class="info">
      <div class="label"><span class="c"></span><small class="z"></small></div>
      <div class="time"><span class="t">--:--</span><small class="d"></small></div>
    </div>
  </section>
</main>

<script>
(function(){
  const CALL_FROM=8, CALL_TO=20, FADE=3, STORE="time-bridge-cities";
  const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const R=Math.random, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), DEG=180/Math.PI;

  /* ================= time zone helpers (clock changes come from the browser's tz database) ================= */
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const fmtCache={};
  function parts(d,tz){
    const f=fmtCache[tz]||(fmtCache[tz]=new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",
      hourCycle:"h23",weekday:"short",day:"numeric",month:"short",year:"numeric"}));
    const p={}; f.formatToParts(d).forEach(x=>p[x.type]=x.value); return p;
  }
  const key=p=>p.year*10000+MON.indexOf(p.month)*100+(+p.day);
  const hourOf=(d,tz)=>{const p=parts(d,tz);return +p.hour+p.minute/60};
  function offset(d,tz){const p=parts(d,tz);return(Date.UTC(+p.year,MON.indexOf(p.month),+p.day,+p.hour,+p.minute)-Math.floor(d/60000)*60000)/60000}
  const utc=m=>"UTC"+(m>=0?"+":"−")+Math.abs(m/60);
  const awake=h=>h>=CALL_FROM&&h<CALL_TO;
  function midnight(instant,tz){ // exact local midnight, also on clock-change days
    let g=Math.floor(instant/60000)*60000;
    for(let i=0;i<3;i++){const p=parts(new Date(g),tz),m=+p.hour*60+(+p.minute);if(!m)break;g-=m*60000;}
    return g;
  }

  /* ================= sunrise / sunset ================= */
  const rad=Math.PI/180, sunCache={};
  function sunTimes(p,lat,lon){
    const id=key(p)+":"+lat; if(sunCache[id]) return sunCache[id];
    const jd=Date.UTC(+p.year,MON.indexOf(p.month),+p.day,12)/864e5+2440587.5;
    const n=Math.round(jd-2451545+0.0008), J=n-lon/360;
    const M=(357.5291+0.98560028*J)%360;
    const C=1.9148*Math.sin(M*rad)+0.02*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
    const L=(M+C+180+102.9372)%360;
    const Jt=2451545+J+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*L*rad);
    const dec=Math.asin(Math.sin(L*rad)*Math.sin(23.4397*rad));
    const cw=(Math.sin(-0.833*rad)-Math.sin(lat*rad)*Math.sin(dec))/(Math.cos(lat*rad)*Math.cos(dec));
    const w=Math.acos(clamp(cw,-1,1))/rad;
    const toMs=j=>(j-2440587.5)*864e5;
    return sunCache[id]=[toMs(Jt-w/360),toMs(Jt+w/360)];
  }

  /* ================= moon phase ================= */
  function moonPhase(ms){const syn=29.530588853,ref=Date.UTC(2000,0,6,18,14);return(((ms-ref)/864e5/syn)%1+1)%1}
  function moonPath(ph){
    const r=10,cx=11,cy=11,k=Math.cos(2*Math.PI*ph),rx=Math.abs(k)*r;
    if(ph<0.5) return `M${cx} ${cy-r}A${r} ${r} 0 0 1 ${cx} ${cy+r}A${rx} ${r} 0 0 ${k>0?0:1} ${cx} ${cy-r}Z`;
    return `M${cx} ${cy-r}A${r} ${r} 0 0 0 ${cx} ${cy+r}A${rx} ${r} 0 0 ${k>0?1:0} ${cx} ${cy-r}Z`;
  }

  /* ================= sky colours ================= */
  const C={night:["#0b1030","#1a2148"],pre:["#141a40","#2c2a58"],dawn:["#5a6aa8","#f2b08c"],morning:["#7fb4e6","#f6d9b8"],
    day:["#5fa6e8","#cfe8fb"],day2:["#5fa2e2","#d3e8f8"],golden:["#6f86c4","#f4b98a"],dusk:["#46407a","#de8a78"],late:["#18204e","#2e2c5c"]};
  function frames(sr,ss){
    const f=[[0,C.night],[sr-1.2,C.pre],[sr-0.2,C.dawn],[sr+1.3,C.morning],[sr+3.5,C.day],
      [ss-3,C.day2],[ss-0.4,C.golden],[ss+0.8,C.dusk],[ss+2,C.late],[24,C.night]];
    for(let i=1;i<f.length;i++) f[i][0]=Math.min(24,Math.max(f[i][0],f[i-1][0]+0.01));
    return f;
  }
  const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
  const mix=(a,b,t)=>{a=rgb(a);b=rgb(b);return"rgb("+a.map((v,i)=>Math.round(v+(b[i]-v)*t))+")"};
  function sky(h,sr,ss){const f=frames(sr,ss);
    for(let i=0;i<f.length-1;i++){const[a,x]=f[i],[b,y]=f[i+1];
      if(h>=a&&h<=b){const t=(h-a)/(b-a||1);return[mix(x[0],y[0],t),mix(x[1],y[1],t)]}}
    return C.night;}

  /* ================= animation engine ================= */
  const anims=new Set(); let raf=0,last=0;
  function tick(t){
    const dt=Math.min(0.04,(t-last)/1000); last=t;
    for(const a of [...anims]) if(!a(dt)) anims.delete(a);
    raf=anims.size?requestAnimationFrame(tick):0;
  }
  function run(fn){anims.add(fn); if(!raf){last=performance.now(); raf=requestAnimationFrame(tick);}}

  const NS="http://www.w3.org/2000/svg";
  function E(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
  /* ================= shared: colours that dim with the sky (no CSS filters, so motion stays smooth) ================= */
  const NIGHT_TINT="#141936";
  const tint=(hex,d)=>mix(hex,NIGHT_TINT,(1-d)*.64);
  function sceneKit(){
    const S={dead:false,light:1,lastD:-1,tints:[]};
    S.TE=(tag,attrs,parent)=>{
      const e=E(tag,attrs,parent);
      ["fill","stroke"].forEach(a=>{const v=attrs[a]; if(v&&v[0]==="#"){S.tints.push([e,a,v]); e.setAttribute(a,tint(v,S.light));}});
      return e;
    };
    S.applyLight=d=>{
      if(Math.abs(d-S.lastD)<.004) return; S.light=S.lastD=d;
      S.tints=S.tints.filter(([e])=>e.isConnected);
      S.tints.forEach(([e,a,v])=>e.setAttribute(a,tint(v,d)));
    };
    return S;
  }

  /* ================= BUDAPEST: Parliament (long low facade, tall central dome, all tips rounded) + bird flock ================= */
  function budapestScene(svg){
    const S=sceneKit(), TE=S.TE;
    const jig=E("g",{},svg);
    const bld=E("g",{},jig), glow=E("g",{},jig);
    const WALL="#efe2ca",WALL2="#e4d2b3",SHADE="#d9c4a2",ROOF="#bb4a3b",ROOF2="#9e3d30",WIN="#cfb790",LIT="#ffd57a";
    const soft={"stroke-linejoin":"round","stroke-linecap":"round"};
    const win=(x,y,w,h)=>{TE("rect",{x,y,width:w,height:h,rx:w/2,fill:WIN},bld);E("rect",{x,y,width:w,height:h,rx:w/2,fill:LIT},glow)};
    // a steep roof whose tip is rounded off
    const spireRoof=(x,w,base,tip,c)=>TE("path",{d:`M${x} ${base}C${x+w*.18} ${base-(base-tip)*.55} ${x+w*.42} ${tip+1.2} ${x+w/2} ${tip}C${x+w*.58} ${tip+1.2} ${x+w*.82} ${base-(base-tip)*.55} ${x+w} ${base}Z`,
      fill:c,stroke:c,"stroke-width":1.6,...soft},bld) && TE("circle",{cx:x+w/2,cy:tip+.9,r:1.15,fill:c},bld);
    const pin=(x,y,h)=>TE("rect",{x:x-.8,y:y-h,width:1.6,height:h+1,rx:.8,fill:ROOF2},bld);   // little rounded pinnacle

    // long facade
    TE("rect",{x:103,y:85,width:98,height:22,rx:2.5,fill:WALL2},bld);
    TE("rect",{x:103,y:93,width:98,height:14,rx:1.5,fill:WALL},bld);
    TE("rect",{x:102,y:82,width:100,height:4.6,rx:2.3,fill:ROOF},bld);
    for(let x=107;x<=197;x+=6) if(x<137||x>167) pin(x,82.6,3.2);
    // wing ends
    [[102,12],[190,12]].forEach(([x,w])=>{
      TE("rect",{x,y:79,width:w,height:28,rx:2.5,fill:WALL},bld);
      spireRoof(x-.4,w+.8,79.6,68,ROOF);
      win(x+w/2-1,85,2,4.4);
    });
    // twin towers either side of the dome
    [[130,6],[168,6]].forEach(([x,w])=>{
      TE("rect",{x,y:74,width:w,height:33,rx:2,fill:WALL},bld);
      spireRoof(x-.4,w+.8,74.6,61,ROOF);
      TE("circle",{cx:x+w/2,cy:60.4,r:1,fill:ROOF2},bld);
      win(x+w/2-.9,78,1.8,4);
    });
    // drum + tall ribbed dome + slim spire
    TE("rect",{x:140,y:72,width:24,height:16,rx:3,fill:WALL},bld);
    TE("rect",{x:138.5,y:70.6,width:27,height:2.8,rx:1.4,fill:SHADE},bld);
    for(let i=0;i<3;i++) win(144.6+i*6.4,75,2.2,6);
    TE("path",{d:"M139.5 71.4C139.5 59 145.5 50.5 152 47C158.5 50.5 164.5 59 164.5 71.4Z",fill:ROOF,stroke:ROOF,"stroke-width":1,...soft},bld);
    TE("path",{d:"M152 47C158.5 50.5 164.5 59 164.5 71.4L152 71.4Z",fill:ROOF2,opacity:.45},bld);
    TE("path",{d:"M145.6 71.4Q146.6 58 152 47.6M158.4 71.4Q157.4 58 152 47.6",fill:"none",stroke:"#d9705c","stroke-width":.6,opacity:.75,...soft},bld);
    TE("rect",{x:150.6,y:36,width:2.8,height:12.5,rx:1.4,fill:ROOF2},bld);
    TE("circle",{cx:152,cy:35,r:1.4,fill:ROOF2},bld);
    // one calm row of windows along the facade
    for(let x=108.5;x<197;x+=4.8){ if((x>101&&x<114.5)||(x>129&&x<137)||(x>139&&x<165)||(x>167&&x<175)||x>189) continue; win(x,89.5,1.8,4.2); }
    for(let x=142.4;x<162;x+=4.8) win(x,92,1.8,4.2);

    let wob=0,wv=0,wobbling=false;
    S.shake=()=>{
      wv+=(R()<.5?-1:1)*26; if(wobbling) return; wobbling=true;
      run(dt=>{ if(S.dead) return false;
        const K=140,Cd=2*.14*Math.sqrt(K),h=1/240;
        for(let n=Math.max(1,Math.round(dt/h));n>0;n--){wv+=(-K*wob-Cd*wv)*h; wob+=wv*h;}
        jig.setAttribute("transform",`translate(152 104) skewX(${wob.toFixed(3)}) translate(-152 -104)`);
        if(Math.abs(wob)<.01&&Math.abs(wv)<.05){wob=wv=0;jig.removeAttribute("transform");wobbling=false;return false}
        return true; });
    };

    let flying=false;
    S.ambient=()=>{
      if(flying||S.dead) return; flying=true;
      const g=E("g",{},svg), n=R()<.5?9:11;
      const slots=[[0,0]]; for(let i=1;slots.length<n;i++){slots.push([-6*i,-2.5*i]);slots.push([-6*i,2.5*i]);}
      const flock=slots.slice(0,n).map(([ox,oy])=>({ox:ox+(R()-.5)*1.2,oy:oy+(R()-.5)*1,ph:R()*6.3,sp:9+R()*1.5,
        el:E("path",{fill:"none","stroke-width":.8,"stroke-linecap":"round","stroke-linejoin":"round"},g)}));
      const dur=8.5+R()*2, y0=34+R()*3, lift=(R()-.5)*4; let t=0;
      run(dt=>{
        t+=dt; const k=t/dur;
        if(S.dead||k>=1){g.remove();flying=false;return false}
        const X=-40+380*(k*k*(3-2*k)*.12+k*.88), Y=y0+lift*k+Math.sin(k*Math.PI*2)*1.8;
        const col=mix("#2a3350","#b8bdd9",1-S.light);
        flock.forEach(b=>{
          const amt=.6+.4*Math.sin(t*.7+b.ph), f=Math.sin(t*b.sp+b.ph)*amt;
          const tipY=(-.3+1.7*f).toFixed(2), ctl=(-1.5-1*f).toFixed(2);
          b.el.setAttribute("d",`M-3.2 ${tipY}Q-1.5 ${ctl} 0 .3Q1.5 ${ctl} 3.2 ${tipY}`);
          b.el.setAttribute("stroke",col);
          b.el.setAttribute("transform",`translate(${(X+b.ox+Math.sin(t*1.1+b.ph)*.6).toFixed(2)} ${(Y+b.oy+Math.sin(t*1.7+b.ph)*.5).toFixed(2)})`);
        });
        return true;
      });
    };

    S.setLight=d=>{S.applyLight(d); glow.style.opacity=clamp(1-d*1.6,0,1).toFixed(3)};
    return S;
  }

  /* ================= INDONESIA: layered jungle silhouettes (+ monkey in Bali) ================= */
  const FLOWERS={
    frangipani(g,TE){for(let k=0;k<5;k++)TE("ellipse",{cx:2.4,cy:0,rx:2.6,ry:1.6,fill:"#fff6ea",transform:`rotate(${k*72+12})`},g);
      TE("circle",{r:1.2,fill:"#ffc94d"},g)},
    bougain(g,TE){[[-1.5,0,1.8,"#e2569a"],[1.4,.5,1.7,"#f07cb4"],[0,1.8,1.6,"#d84a8f"]].forEach(([x,y,r,c])=>TE("circle",{cx:x,cy:y,r,fill:c},g))},
    orchid(g,TE){for(let k=0;k<5;k++)TE("ellipse",{cx:2.3,cy:0,rx:2.4,ry:1.25,fill:k%2?"#e0579b":"#cc4489",transform:`rotate(${k*72-90})`},g);
      TE("circle",{cx:0,cy:.8,r:1.1,fill:"#ffe08a"},g)}
  };
  /* swag = vine draped between two points [x1,y1,x2,y2,sag,width];
     strand = [swag index (-1 = from the top edge), t along the swag or x, length, curl, flower, monkey] */
  const JUNGLE={
    bali:{dark:"#1c4632",mid:"#2c6a47",light:"#4e9566",back:"#a9cdb2",vein:"#8fcaa0",flower:"frangipani",taper:true,backOpacity:.36,
      back_swags:[[-10,-4,170,-4,20,1],[88,-4,320,-4,28,1],[30,-4,230,-4,36,.9],[150,-4,330,-4,46,.9],[-20,-4,110,-4,30,.9]],
      back_strands:[[0,.62,40],[1,.42,46],[1,.66,18],[2,.3,28],[2,.55,26],[3,.25,18],[4,.6,22]],
      swags:[[-6,-3,132,-4,3.5,1.3],[136,-4,306,2,24,2.2],[204,-5,308,24,8,1.6],[140,-6,312,-6,6,1.3],[138,-5,244,-4,15,1.5],[230,-6,312,6,5,1.2],[-10,-4,60,-4,19,1.8],[38,-5,128,-4,16,1.8],[96,-5,156,-4,11,1.4]],

    const FLAGS=["#e2ab3d","#c9472f","#2f7d6a","#f4ebdb","#3f72b5"];

      const s={x1,y1,x2,y2,sag,off:0,ov:0,K:34+R()*10,flags:[],bulbs:[]};
      s.line=TE("path",{fill:"none",stroke:"#5b4636","stroke-width":.55,"stroke-linecap":"round"},deco);
      for(let i=1;i<=n;i++){
        const t=i/(n+1), col=FLAGS[(i+(x1>170?2:0))%FLAGS.length];
        const f=E("g",{},deco);
        TE("path",{d:"M-2.6 0L2.6 0L0 6.2Z",fill:col,stroke:col,"stroke-width":.9,...soft},f);

    const sPt=(s,t)=>{const cx=(s.x1+s.x2)/2, cy=(s.y1+s.y2)/2+2*(s.sag+s.off), u=1-t;
      return {x:u*u*s.x1+2*u*t*cx+t*t*s.x2, y:u*u*s.y1+2*u*t*cy+t*t*s.y2,
              a:Math.atan2(2*u*(cy-s.y1)+2*t*(s.y2-cy), 2*u*(cx-s.x1)+2*t*(s.x2-cx))*DEG}};
    let flutter=0;
    function drawDeco(time){
      strings.forEach(s=>{
        const cx=(s.x1+s.x2)/2, cy=(s.y1+s.y2)/2+2*(s.sag+s.off);

        while(acc>=h){ acc-=h;
          strings.forEach(s=>{s.ov+=(-s.K*s.off-2*.12*Math.sqrt(s.K)*s.ov)*h; s.off+=s.ov*h;});

        const still=strings.every(s=>Math.abs(s.off)<.01&&Math.abs(s.ov)<.05)&&bells.every(b=>Math.abs(b.a)<.05&&Math.abs(b.av)<.2)&&flutter<.01;
        if(still){strings.forEach(s=>{s.off=s.ov=0});bells.forEach(b=>{b.a=b.av=0});flutter=0;drawDeco(clock);moving=false;return false}
        return true; });
    }
    S.shake=()=>{
      bells.forEach(b=>b.av+=(R()<.5?-1:1)*(140+R()*80));
      strings.forEach(s=>s.ov+=(R()<.5?-1:1)*(3.5+R()*3));

      for(let i=0;i<n;i++){
        const L={x:60+R()*180, y:112, delay:i*.55+R()*.5, dur:10+R()*3, ph:R()*6.3, drift:(R()-.5)*30, t:0};
        const g=E("g",{opacity:0},lg);

        E("path",{d:"M-3 -4.6Q-3.3 -5.3 -2.6 -5.4L2.6 -5.4Q3.3 -5.3 3 -4.6L2.2 3.9Q2 4.6 1.3 4.6L-1.3 4.6Q-2 4.6 -2.2 3.9Z",fill:"#f7d9a6"},g);
        E("path",{d:"M-2.4 .8L2.4 .8L2.2 3.9Q2 4.6 1.3 4.6L-1.3 4.6Q-2 4.6 -2.2 3.9Z",fill:"#ffb24d",opacity:.75},g);
        E("circle",{cy:4.4,r:.8,fill:"#fff2bf"},g);
        run(dt=>{

          if(k>=1){g.remove(); if(--alive===0){lg.remove();floating=false} return false}
          const e=1-Math.pow(1-k,1.6), sc=1.25-.6*e;

          halo.setAttribute("opacity",((1-S.light)*.95+.12).toFixed(3));
          return true;
        });

    };

    S.setLight=d=>{S.applyLight(d); glow.style.opacity=clamp(1-d*1.6,0,1).toFixed(3); back.style.opacity=(.35+.65*d).toFixed(3)};
    return S;
  }

    [57.6,60.6].forEach(y=>TE("rect",{x:150.2,y,width:3.6,height:1.1,rx:.55,fill:GOLD},bld));
    TE("path",{d:"M105 44.6Q152 52.4 199 44.6L198 49.8Q152 56.6 106 49.8Z",fill:VERM,stroke:VERM,"stroke-width":1.4,...soft},bld); // kasagi

    /* sakura branches from the top (right of the tabs) */

      const b={g,ax,ay,a:0,av:0,spots}; branches.push(b); return b;
    }
    branch(306,-3,[["M306 -2C284 3 262 7 238 17",2.2],["M276 2C268 10 263 17 259 25",1.4],["M252 11C246 13 240 12 234 9",1.1],["M292 0C291 6 293 11 297 15",1.1]],

    branch(166,-4,[["M166 -4C172 4 182 8 194 9",1.6],["M180 6C181 11 179 15 176 18",1]],
      [[194,9,4],[176,18,3],[184,6,3]]);
    branch(-6,-3,[["M-6 -2C14 1 34 2 58 0",1.6],["M30 1C34 4 40 5 46 4",1]],

    const drawBranches=()=>branches.forEach(b=>b.g.setAttribute("transform",`rotate(${b.a.toFixed(3)} ${b.ax} ${b.ay})`));

    const petal=()=>{const g=E("g",{},fx); TE("path",{d:"M0 0C1.1 -1.5 3 -1.4 3.5 -.2L2.9 0L3.5 .2C3 1.4 1.1 1.5 0 0Z",fill:R()<.5?PINK:PINK2},g); return g};
    function fall(x,y){
      const g=petal(); let t=0; const ph=R()*6.3, vx=(R()-.5)*10;
      run(dt=>{ t+=dt; if(S.dead||t>4.5||y>112){g.remove();return false}
        x+=(vx+Math.sin(t*2.6+ph)*12)*dt; y+=(15+Math.sin(t*5+ph)*4)*dt;

        setTimeout(()=>{if(!S.dead) fall(sp[0],sp[1])},i*90);}

    return S;
  }

    const S=sceneKit(), TE=S.TE;
    const WHITE="#f4f5f2",WHITE2="#dce2df",SHADE="#c1cac6",DOME="#4f9a87",DOME2="#3d7f6e",ZINC="#7f9c95",GOLD="#d9b04c",WIN="#9fb0ad",LIT="#ffd57a";
    const soft={"stroke-linejoin":"round","stroke-linecap":"round"};
    const low=E("g",{transform:"translate(0 4.5)"},svg), jig=E("g",{},low), bld=E("g",{},jig), glow=E("g",{},jig), fx=E("g",{},svg);
    const win=(x,y,w,h)=>{TE("rect",{x,y,width:w,height:h,rx:w/2,fill:WIN},bld);E("rect",{x,y,width:w,height:h,rx:w/2,fill:LIT},glow)};
    const dome=(cx,base,w,h,lantern)=>{
      TE("path",{d:`M${cx-w/2} ${base}C${cx-w/2} ${base-h*.62} ${cx-w*.27} ${base-h} ${cx} ${base-h}C${cx+w*.27} ${base-h} ${cx+w/2} ${base-h*.62} ${cx+w/2} ${base}Z`,fill:DOME},bld);
      TE("path",{d:`M${cx} ${base-h}C${cx+w*.27} ${base-h} ${cx+w/2} ${base-h*.62} ${cx+w/2} ${base}L${cx} ${base}Z`,fill:DOME2,opacity:.55},bld);
      const lw=w*.16, lh=lantern;
      TE("rect",{x:cx-lw/2,y:base-h-lh+.6,width:lw,height:lh,rx:lw*.3,fill:WHITE},bld);
      TE("path",{d:`M${cx-lw*.8} ${base-h-lh+1}Q${cx} ${base-h-lh-lw*.9} ${cx+lw*.8} ${base-h-lh+1}Z`,fill:DOME},bld);
      TE("circle",{cx,cy:base-h-lh-lw*.75,r:Math.max(.7,lw*.28),fill:GOLD},bld);
    };

    // wide granite steps of Senate Square
    TE("rect",{x:100,y:100.5,width:104,height:6,rx:1.6,fill:SHADE},bld);
    TE("rect",{x:107,y:97.4,width:90,height:4,rx:1.4,fill:WHITE2},bld);
    TE("rect",{x:113,y:94.4,width:78,height:4,rx:1.4,fill:SHADE},bld);
    // main block
    TE("rect",{x:119,y:64,width:66,height:31,rx:2,fill:WHITE},bld);
    TE("rect",{x:119,y:64,width:66,height:3,rx:1.2,fill:WHITE2},bld);
    TE("rect",{x:119,y:92.4,width:66,height:2.6,rx:1,fill:SHADE,opacity:.7},bld);
    [[123,72],[178.6,72],[123,83],[178.6,83]].forEach(([x,y])=>win(x,y,2.4,5.4));
    // corner towers with small domes
    [[124,10],[180,10]].forEach(([cx,w])=>{
      TE("rect",{x:cx-w/2,y:54,width:w,height:11,rx:1.6,fill:WHITE},bld);
      win(cx-1,57.4,2,4.4);
      dome(cx,54.6,w+1,7.4,3);
    });
    // drum + main dome
    TE("rect",{x:139.5,y:44,width:25,height:21,rx:2,fill:WHITE},bld);
    TE("rect",{x:138,y:42.6,width:28,height:2.6,rx:1.3,fill:WHITE2},bld);
    for(let i=0;i<4;i++){const x=143+i*6; TE("rect",{x:x-.5,y:46,width:1,height:17,rx:.5,fill:WHITE2},bld); if(i<3) win(x+1.8,49,2.4,7);}
    dome(152,43.4,27,17.5,5.2);
    // portico: pediment on six columns, zinc apostles on top
    TE("rect",{x:131,y:70.6,width:42,height:24,rx:1,fill:SHADE},bld);                          // shadow behind columns
    for(let i=0;i<6;i++){const x=134.5+i*7-1.7; TE("rect",{x,y:71,width:3.4,height:23.6,rx:1.2,fill:WHITE},bld); TE("rect",{x:x-.6,y:70.4,width:4.6,height:1.4,rx:.7,fill:WHITE2},bld);}
    E("rect",{x:149.6,y:80,width:4.8,height:14,rx:2.2,fill:LIT,opacity:.9},glow);               // warm doorway at night
    TE("rect",{x:129.4,y:66.6,width:45.2,height:4.2,rx:1.4,fill:WHITE2},bld);                  // entablature
    TE("path",{d:"M128.6 67.2L152 57.2L175.4 67.2Z",fill:WHITE,stroke:WHITE,"stroke-width":1.6,...soft},bld);
    TE("path",{d:"M134 66L152 58.6L170 66",fill:"none",stroke:SHADE,"stroke-width":.6,...soft},bld);
    const apostle=(x,y,s=1)=>{TE("rect",{x:x-.9*s,y:y-3.4*s,width:1.8*s,height:3.6*s,rx:.8*s,fill:ZINC},bld);TE("circle",{cx:x,cy:y-4*s,r:.85*s,fill:ZINC},bld)};
    apostle(129.6,67); apostle(174.4,67); apostle(152,57.6,1.1);
    [121.5,127,177,182.5].forEach(x=>apostle(x,64.4,.9));

    let wob=0,wv=0,wobbling=false;
    S.shake=()=>{
      wv+=(R()<.5?-1:1)*26; if(wobbling) return; wobbling=true;
      run(dt=>{ if(S.dead) return false;
        const K=140,Cd=2*.14*Math.sqrt(K),h=1/240;
        for(let n=Math.max(1,Math.round(dt/h));n>0;n--){wv+=(-K*wob-Cd*wv)*h; wob+=wv*h;}
        jig.setAttribute("transform",`translate(152 104) skewX(${wob.toFixed(3)}) translate(-152 -104)`);
        if(Math.abs(wob)<.01&&Math.abs(wv)<.05){wob=wv=0;jig.removeAttribute("transform");wobbling=false;return false}
        return true; });
    };

    /* seagulls gliding across: long soaring arcs with the odd lazy flap */
    function gulls(){
      const n=2+Math.floor(R()*2), g=E("g",{},fx), dir=R()<.5?1:-1;
      const list=Array.from({length:n},(_,i)=>{
        const el=E("g",{},g);
        const wing=E("path",{fill:"none","stroke-width":1.1,"stroke-linecap":"round","stroke-linejoin":"round"},el);
        const tips=E("path",{fill:"none","stroke-width":1.15,"stroke-linecap":"round"},el);
        const body=E("ellipse",{cx:0,cy:.5,rx:1.5,ry:.75},el);
        return {el,wing,tips,body,ox:-i*(16+R()*10),oy:(R()-.5)*14,ph:R()*6.3,flapAt:1+R()*2,scale:.9+R()*.35};
      });
      const dur=11+R()*3, y0=33+R()*9; let t=0;
      run(dt=>{
        t+=dt; const k=t/dur; if(S.dead||k>=1){g.remove();return k<1?false:(endGulls(),false)}
        const night=1-S.light, wingC=mix("#ffffff","#c7cbe0",night), tipC=mix("#3a3f4a","#9ba1bb",night);
        list.forEach(b=>{
          const X=dir>0?(-30+380*k+b.ox):(330-380*k-b.ox);
          const Y=y0+b.oy+Math.sin(t*.55+b.ph)*5;
          const lt=(t+b.ph)%4; const flap=lt<b.flapAt?Math.sin(lt/b.flapAt*Math.PI*3)*.9:0;  // a few flaps, then a long glide
          const up=-1.6-flap*1.6, tip=.9+flap*1.4;
          b.wing.setAttribute("d",`M-6 ${tip.toFixed(2)}Q-3.4 ${up.toFixed(2)} -.4 .4M.4 .4Q3.4 ${up.toFixed(2)} 6 ${tip.toFixed(2)}`);
          b.tips.setAttribute("d",`M-6 ${tip.toFixed(2)}L-4.8 ${(tip-.7).toFixed(2)}M6 ${tip.toFixed(2)}L4.8 ${(tip-.7).toFixed(2)}`);
          b.wing.setAttribute("stroke",wingC); b.tips.setAttribute("stroke",tipC); b.body.setAttribute("fill",wingC);
          b.el.setAttribute("transform",`translate(${X.toFixed(2)} ${Y.toFixed(2)}) rotate(${(Math.sin(t*.55+b.ph)*6*dir).toFixed(2)}) scale(${(b.scale*dir).toFixed(3)} ${b.scale.toFixed(3)})`);
        });
        return true;
      });
    }
    /* light snow flurry, only in the snowy months */
    function snow(){
      const g=E("g",{},fx), n=34; let alive=n;
      for(let i=0;i<n;i++){
        const f={x:R()*320-10, y:-6-R()*30, vy:9+R()*7, ph:R()*6.3, r:.55+R()*.75, delay:R()*5, t:0};
        const c=E("circle",{r:f.r,fill:"#ffffff",opacity:0},g);
        run(dt=>{
          if(S.dead){g.remove();return false}
          f.t+=dt; if(f.t<f.delay) return true; const t=f.t-f.delay;
          f.y+=f.vy*dt; const x=f.x+Math.sin(t*1.3+f.ph)*4;
          c.setAttribute("cx",x.toFixed(2)); c.setAttribute("cy",f.y.toFixed(2));
          c.setAttribute("opacity",(Math.min(1,t*2)*.9).toFixed(2));
          if(f.y>110){c.remove(); if(--alive===0){g.remove();endGulls()} return false}
          return true;
        });
      }
    }
    let busy=false; const endGulls=()=>{busy=false};
    S.ambient=()=>{
      if(busy||S.dead) return; busy=true;
      const m=new Date().getMonth(), winter=m>=10||m<=2;      // Nov – Mar
      if(winter&&R()<.5) snow(); else gulls();
    };

    S.setLight=d=>{S.applyLight(d); glow.style.opacity=clamp(1-d*1.6,0,1).toFixed(3)};
    return S;
  }

  const SCENES={budapest:budapestScene,helsinki:helsinkiScene,bali:vineScene("bali"),thai:thaiScene,japan:japanScene};

  /* ================= page ================= */
  const top=document.getElementById("top"),bottom=document.getElementById("bottom");
  const pick=el=>el.querySelector('.tabs [aria-pressed="true"]').dataset;
  let base;

  function mountScene(band){
    if(band.scene) band.scene.dead=true;
    const svg=band.querySelector(".scene"); while(svg.firstChild) svg.firstChild.remove();
    const f=SCENES[pick(band).scene]; band.scene=f?f(svg):null;
  }

  function paint(el,d,ref){
    const z=pick(el),p=parts(d,z.tz),h=+p.hour+p.minute/60;
    const [rise,set]=sunTimes(p,+z.lat,+z.lon), sr=hourOf(new Date(rise),z.tz), ss=hourOf(new Date(set),z.tz);
    const [t0,b0]=sky(h,sr,ss);
    el.style.background=`linear-gradient(180deg,${t0},${b0})`;
    const day=h>=sr+0.6&&h<=ss-0.3; el.classList.toggle("light",day); el.classList.toggle("dark",!day);
    const W=el.clientWidth,H=el.clientHeight,arc=t=>[W*(.1+.8*t),H*(.8-.55*Math.sin(Math.PI*t))];
    const sun=el.querySelector(".sun"),moon=el.querySelector(".moon");
    const st=(h-sr)/(ss-sr);
    if(st>=0&&st<=1){const[x,y]=arc(st);sun.style.left=x+"px";sun.style.top=y+"px";sun.style.opacity=1}else sun.style.opacity=0;
    const nightLen=24-(ss-sr), mt=(h>=ss?h-ss:h+24-ss)/nightLen;
    if(mt>=0&&mt<=1&&!(st>=0&&st<=1)){const[x,y]=arc(mt);moon.style.left=x+"px";moon.style.top=y+"px";moon.style.opacity=1}else moon.style.opacity=0;
    moon.querySelector(".lit").setAttribute("d",moonPath(moonPhase(+d)));
    const dayAmt=Math.min(clamp((h-(sr-.8))/1.6,0,1),clamp((ss+.8-h)/1.6,0,1));
    if(el.scene) el.scene.setLight(dayAmt);
    el.querySelector(".c").textContent=z.city;
    el.querySelector(".z").textContent=z.country+" · "+utc(offset(d,z.tz));
    el.querySelector(".t").textContent=p.hour+":"+p.minute;
    let rel=""; if(ref){const k=key(p);rel=k>ref?" · next day":k<ref?" · prev day":""}
    el.querySelector(".d").textContent=`${p.weekday} ${p.day} ${p.month}${rel}`;
    return p;
  }

  /* ---------- smooth slider: a critically damped spring chases the pointer ---------- */
  const sl=document.getElementById("slider"), rail=sl.querySelector(".rail"), thumb=sl.querySelector(".thumb");
  let val=0, vel=0, mid=0, midV=0, target=0, maxV=1439, springOn=false, dragging=false;
  const SPRING=160;                                    // higher = snappier, lower = lazier
  function placeThumb(){thumb.style.left=(val/maxV*100).toFixed(3)+"%"}
  function goTo(v,instant){
    target=clamp(v,0,maxV);
    if(instant||REDUCED){val=mid=target;vel=midV=0;placeThumb();render();return}
    if(springOn) return; springOn=true;
    run(dt=>{
      // two springs in a row: the first chases the pointer, the thumb chases the first.
      // That gives an S-curve: slow start, fast middle, slow stop, whatever the drag speed.
      const k=2*Math.sqrt(SPRING), h=1/240;
      for(let n=Math.max(1,Math.round(dt/h));n>0;n--){
        midV+=(SPRING*(target-mid)-k*midV)*h; mid+=midV*h;
        vel+=(SPRING*(mid-val)-k*vel)*h; val+=vel*h;
      }
      const done=Math.abs(target-val)<0.05&&Math.abs(vel)<0.3&&Math.abs(midV)<0.3;
      if(done){val=mid=target;vel=midV=0}
      placeThumb(); render();
      if(done&&!dragging){springOn=false;return false}
      return true;
    });
  }
  const fromX=x=>{const r=rail.getBoundingClientRect();return (x-r.left)/r.width*maxV};
  sl.addEventListener("pointerdown",e=>{e.preventDefault();sl.focus();dragging=true;sl.classList.add("dragging");
    sl.setPointerCapture(e.pointerId);goTo(fromX(e.clientX))});
  sl.addEventListener("pointermove",e=>{if(dragging)goTo(fromX(e.clientX))});
  const end=()=>{dragging=false;sl.classList.remove("dragging")};
  sl.addEventListener("pointerup",end); sl.addEventListener("pointercancel",end);
  sl.addEventListener("keydown",e=>{
    const step={ArrowRight:5,ArrowUp:5,ArrowLeft:-5,ArrowDown:-5,PageUp:60,PageDown:-60}[e.key];
    if(step!==undefined){e.preventDefault();goTo(Math.round((target+step)/5)*5)}
    else if(e.key==="Home"){e.preventDefault();goTo(0)} else if(e.key==="End"){e.preventDefault();goTo(maxV)}
  });

  // Green = both places between 08:00 and 20:00 local, soft edges
  function buildTrack(){
    const cs=getComputedStyle(document.documentElement);
    const on=cs.getPropertyValue("--call").trim(), off=cs.getPropertyValue("--line").trim();
    const A=pick(top).tz,B=pick(bottom).tz,len=maxV+1;
    const okAt=m=>{const d=new Date(base+m*60000);return awake(hourOf(d,A))&&awake(hourOf(d,B))};
    let prev=okAt(0); const stops=[`${prev?on:off} 0%`];
    for(let m=5;m<len;m+=5){const ok=okAt(m);
      if(ok!==prev){const p=m/len*100;
        stops.push(`${prev?on:off} ${Math.max(0,p-FADE).toFixed(2)}%`,`${ok?on:off} ${Math.min(100,p+FADE).toFixed(2)}%`);prev=ok;}}
    stops.push(`${prev?on:off} 100%`);
    sl.style.setProperty("--track",`linear-gradient(90deg,${stops.join(",")})`);
  }

  // Slider spans the top city's real day (23 or 25 hours on clock-change days)
  function setBase(instant){
    const tz=pick(top).tz; base=midnight(+instant,tz);
    const next=midnight(base+26*3600000,tz); maxV=Math.round((next-base)/60000)-1;
    sl.setAttribute("aria-valuemax",maxV);
    val=mid=target=clamp((+instant-base)/60000,0,maxV); vel=midV=0; placeThumb(); buildTrack();
  }
  function render(){
    const d=new Date(base+val*60000),p=paint(top,d);paint(bottom,d,key(p));
    const ok=awake(hourOf(d,pick(top).tz))&&awake(hourOf(d,pick(bottom).tz));
    sl.style.setProperty("--thumb",ok?"var(--call)":"var(--ink)");
    sl.setAttribute("aria-valuenow",Math.round(val));
    sl.setAttribute("aria-valuetext",`${pick(top).city} ${p.hour}:${p.minute}`);
  }

  function save(){try{localStorage.setItem(STORE,JSON.stringify([pick(top).tz,pick(bottom).tz]))}catch(e){}}
  function restore(){try{const v=JSON.parse(localStorage.getItem(STORE)||"null");if(!v)return;
    [top,bottom].forEach((el,i)=>{const b=el.querySelector(`.tabs [data-tz="${v[i]}"]`);
      if(b) el.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));});}catch(e){}}

  document.querySelectorAll(".tabs").forEach(g=>g.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b||b.getAttribute("aria-pressed")==="true") return;
    const band=g.closest(".band"), instant=new Date(base+val*60000);
    g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
    save(); mountScene(band); setBase(instant); render();
  }));
  // tap a layer = the ground shakes a little
  [top,bottom].forEach(band=>band.addEventListener("click",e=>{
    if(REDUCED||e.target.closest(".tabs")) return; band.scene&&band.scene.shake&&band.scene.shake();
  }));

  document.getElementById("now").addEventListener("click",()=>{
    const n=Date.now(); if(midnight(n,pick(top).tz)===base) goTo((n-base)/60000); else {setBase(new Date());render()}
  });
  addEventListener("resize",render);
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{buildTrack();render()});

  // ambient moments, roughly twice a minute per layer
  function ambient(band,first){
    setTimeout(function go(){
      if(!REDUCED&&!document.hidden&&band.scene&&band.scene.ambient) band.scene.ambient();
      setTimeout(go,24000+R()*12000);
    },first);
  }

  window.__tbNow=()=>{dragging=false; setBase(new Date()); render();};
  restore(); mountScene(top); mountScene(bottom); setBase(new Date()); render();
  ambient(top,3000); ambient(bottom,7500);
  setInterval(()=>{
    if(dragging||springOn) return;
    const n=Date.now(); if(Math.abs(n-(base+val*60000))>6*60000) return;
    if(midnight(n,pick(top).tz)===base) goTo((n-base)/60000); else {setBase(new Date());render()}
  },30000);
})();
</script>
</body>
